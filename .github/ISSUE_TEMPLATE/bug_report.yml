name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal collection or command helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `rustman --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 (Apple Silicon), Ubuntu 24.04, Windows 11
    validations:
      required: true
