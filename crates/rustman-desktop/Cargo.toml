[package]
name = "rustman-desktop"
version = "0.3.0"
license = "MIT"
repository = "https://github.com/frammawiliansyah/rustman"
edition = "2021"
description = "Local backend server and IPC bridge for the rustman desktop UI"

[[bin]]
name = "rustman-desktop"
path = "src/main.rs"

[dependencies]
rustman-core = { path = "../rustman-core" }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
wry = "0.47"
tao = "0.30"
png = "0.17"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.24"
