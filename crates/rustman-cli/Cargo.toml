[package]
name = "rustman-cli"
version = "0.1.0"
edition = "2021"
description = "Command line interface for rustman"

[[bin]]
name = "rustman"
path = "src/main.rs"

[dependencies]
rustman-core = { path = "../rustman-core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"
