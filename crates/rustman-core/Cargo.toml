[package]
name = "rustman-core"
version = "0.2.0"
license = "MIT"
repository = "https://github.com/frammawiliansyah/rustman"
edition = "2021"
description = "Core library and data models for rustman"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "cookies"] }
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
boa_engine = "0.19"
tokio-tungstenite = { version = "0.24", features = ["connect", "handshake"] }
eventsource-stream = "0.2"
futures-util = "0.3"
base64 = "0.22"
axum = "0.7"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = "0.4"
csv = "1.3"
