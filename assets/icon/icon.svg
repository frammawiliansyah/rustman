<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Rustman</title>
  <defs>
    <!-- Same indigo gradient as the logo tile and primary buttons in the app UI -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="176" x2="0" y2="848">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e4ff"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#2e2a8f" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#sheen)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="228" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="4"/>
  <!-- A heavy R: wide stem, big bowl with a small counter, thick diagonal leg -->
  <g transform="translate(-18 0)" fill="url(#glyph)" stroke="url(#glyph)" stroke-width="28" stroke-linejoin="round" filter="url(#lift)">
    <rect x="270" y="190" width="170" height="644"/>
    <path fill-rule="evenodd" d="M270 190H575A205 205 0 0 1 575 600H270ZM440 330V460H575A65 65 0 0 0 575 330Z"/>
    <path d="M492 596H664L792 834H620Z"/>
  </g>
</svg>
