<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Rustman</title>
  <defs>
    <!-- Same indigo gradient as the logo tile and primary buttons in the app UI -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#sheen)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="228" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="4"/>
  <g transform="translate(-36 -11)">
  <!-- R: stem, bowl and leg drawn as one thick rounded stroke -->
  <path d="M372 800V246H562a164 164 0 0 1 0 328H372M548 574L706 800" fill="none" stroke="#ffffff" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Request arrow cut into the bowl -->
  <path d="M462 380H574V348L648 410L574 472V440H462Z" fill="#6366f1"/>
  </g>
</svg>
